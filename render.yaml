# Render Blueprint (DEP-01, docs/deployment.md). Backend only; the frontend is on Vercel.
# Free plan: the web service sleeps after 15 min idle; Postgres expires 30 days after creation.
# Values marked `sync: false` are entered in the Render dashboard, never committed.
services:
  - type: web
    name: sora-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: sora-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: sora-redis
          property: connectionString
      # The Render hostname is added automatically (RENDER_EXTERNAL_HOSTNAME).
      - key: ALLOWED_HOSTS
        value: localhost
      - key: FRONTEND_URL
        sync: false
      # Measured after deploy, see docs/deployment.md §4.
      - key: NUM_PROXIES
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: AI_PROVIDER
        value: gemini
      - key: AI_API_KEY
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_CLAIM_EMAIL
        sync: false
      # First admin login (deploy/start.sh); remove both after the first successful boot.
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      # 512 MB instance: 2 gunicorn workers + 1 Celery child (deploy/start.sh).
      - key: WEB_CONCURRENCY
        value: "2"
      - key: CELERY_CONCURRENCY
        value: "1"

  - type: keyvalue
    name: sora-redis
    plan: free
    region: frankfurt
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  - name: sora-db
    plan: free
    region: frankfurt
