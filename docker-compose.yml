services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: study_assistant
      POSTGRES_USER: study_user
      POSTGRES_PASSWORD: study_pass
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U study_user -d study_assistant"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
